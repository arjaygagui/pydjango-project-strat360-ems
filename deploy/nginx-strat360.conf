# Add these blocks INSIDE the existing HTTPS server { … } of the shared site (next to the other
# apps' locations), then: sudo nginx -t && sudo systemctl reload nginx
# Everything under /strat360/ goes to this app; the path is passed through unchanged because the
# app itself serves under /strat360/ (DJANGO_URL_PREFIX=strat360/ in .env), static files included.

location = /strat360 { return 301 /strat360/; }

location /strat360/ {
    proxy_pass http://unix:/run/strat360/gunicorn.sock;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_read_timeout 90s;          # AI Analytics answers take ~5-10 s; big first loads a few s
    client_max_body_size 5m;
}
